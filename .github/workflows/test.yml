name: Test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # frontend/dist/spa is go:embed'ed, so Go does not compile without it.
      # The built SPA is cached on the frontend sources; a hit skips node entirely.
      - name: Frontend build cache
        id: spa
        uses: actions/cache@v4
        with:
          path: frontend/dist/spa
          key: spa-${{ hashFiles('frontend/package-lock.json', 'frontend/quasar.conf.js', 'frontend/babel.config.js', 'frontend/env.js', 'frontend/src/**', 'frontend/public/**') }}

      - uses: actions/setup-node@v4
        if: steps.spa.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.spa.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # caches the module and build caches, keyed on go.sum
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      # Tests are offline. The ones that need the external ChineseSubFinder-TestData repo,
      # ffmpeg or the real network (CSF_TEST_NETWORK=1) skip themselves; the summary lists them.
      - name: go test
        run: |
          set -o pipefail
          status=0
          go test -v ./... > test.log 2>&1 || status=$?
          grep -E '^(ok|FAIL|panic:)|^\s*--- FAIL' test.log || true
          {
            echo "### go test"
            echo "- packages ok: $(grep -c '^ok' test.log)"
            echo "- packages failed: $(grep -c '^FAIL\s' test.log)"
            echo "- tests passed: $(grep -cE '^--- PASS' test.log)"
            echo "- tests skipped: $(grep -cE '^--- SKIP' test.log)"
            echo
            echo "<details><summary>Skipped tests</summary>"
            echo
            echo '```'
            grep -B1 -E '^--- SKIP' test.log | grep -v '^--$' || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::group::full log"
            cat test.log
            echo "::endgroup::"
          fi
          exit $status
